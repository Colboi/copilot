[package]
name = "colpilot"
version = "0.1.0"
description = "Colpilot desktop tool dashboard"
authors = ["ColboiIN"]
edition = "2021"

[lib]
name = "colpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
